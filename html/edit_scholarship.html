<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Scholarship</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/nav_bar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/register_scholarship.css">
  <script src="../js/insert_footer.js" defer></script>
  <script src="../js/insert_nav_bar.js" defer></script>
  <script src="../js/edit_scholarship.js" defer></script>
</head>
<body>
  <header class="header-nav-bar"></header>

  <main class="scholarship-shell">
    <section class="scholarship-form-panel">
      <div class="form-header">
        <h2>Edit Scholarship</h2>
      </div>

      <form id="editScholarshipForm">
        <div class="form-grid">
          <label class="full-span">
            <span>Scholarship Title</span>
            <input type="text" id="title" name="title" required>
          </label>

          <label>
            <span>Degree Level</span>
            <select id="degreeLevel" name="degreeLevel" required>
              <option value="">Select level</option>
              <option>Undergraduate</option>
              <option>Graduate</option>
              <option>Postgraduate Research</option>
              <option>Exchange / Visiting</option>
              <option>Open to Multiple Levels</option>
            </select>
          </label>

          <label class="full-span">
            <span>Description</span>
            <textarea id="description" name="description" rows="4" required></textarea>
          </label>

          <label>
            <span>Source URL</span>
            <input type="url" id="sourceUrl" name="sourceUrl" required>
          </label>

          <label>
            <span>Host Institution</span>
            <input type="text" id="hostInstitution" name="hostInstitution" required>
          </label>

          <label>
            <span>Field of Study</span>
            <input type="text" id="fieldOfStudy" name="fieldOfStudy" required>
          </label>

          <label>
            <span>Deadline</span>
            <input type="date" id="deadline" name="deadline" required>
          </label>

          <label>
            <span>Engagement Type</span>
            <input type="text" id="engagementType" name="engagementType" required>
          </label>

          <label class="full-span">
            <span>Eligibility</span>
            <textarea id="eligibility" name="eligibility" rows="5" required></textarea>
          </label>

          <label class="full-span">
            <span>Benefits</span>
            <textarea id="benefits" name="benefits" rows="5" required></textarea>
          </label>
        </div>

        <div class="form-footer">
          <button type="submit">Save Changes</button>
        </div>
      </form>
    </section>
  </main>

  <div class="footer"></div>
</body>
</html>
